name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci # also runs `wxt prepare` (postinstall), which generates the types
            - run: npm run lint
            - run: npm run format:check
            - run: npm run compile
            - run: npx vitest run
            - run: npm run build
            - run: npm run build:firefox
