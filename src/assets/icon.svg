<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <!-- A sticky note with a folded corner. Kept to bold shapes so it still reads at 16px. -->
    <defs>
        <clipPath id="note">
            <path d="M14 26a12 12 0 0 1 12-12h76a12 12 0 0 1 12 12v60l-28 28H26a12 12 0 0 1-12-12z" />
        </clipPath>
    </defs>

    <!-- shadow -->
    <path
        d="M18 32a12 12 0 0 1 12-12h76a12 12 0 0 1 12 12v60l-28 28H30a12 12 0 0 1-12-12z"
        fill="#000"
        fill-opacity="0.18"
    />

    <g clip-path="url(#note)">
        <rect x="14" y="14" width="100" height="100" fill="#ffe066" />
        <!-- header strip, like the notes on pages -->
        <rect x="14" y="14" width="100" height="22" fill="#fcc419" />
    </g>

    <!-- folded corner -->
    <path d="M114 86 86 114V96a10 10 0 0 1 10-10z" fill="#f2b705" />

    <!-- text lines -->
    <g fill="#5c4a12" fill-opacity="0.7">
        <rect x="28" y="50" width="72" height="9" rx="4.5" />
        <rect x="28" y="68" width="58" height="9" rx="4.5" />
        <rect x="28" y="86" width="40" height="9" rx="4.5" />
    </g>
</svg>
